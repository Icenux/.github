name: Bug report
description: Something does not work as expected
title: "[BUG] "
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: |
        <img src="https://raw.githubusercontent.com/Icenux/.github/main/assets/logo.png" width="64" align="left" alt="Logo">

        Thanks for the report. A few details help to fix it faster.

        <br clear="left">
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Press ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.0.0 or output of --version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, runtime or anything else relevant to your setup.
      placeholder: Ubuntu 24.04, Firefox 130, Node 22
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots / output
      description: Paste logs or terminal output, or drag in screenshots.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues first
          required: true
