name: Icenux – Feature request
description: Suggest an improvement or new support (compositor, distro, option)
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        <img src="https://raw.githubusercontent.com/Icenux/.github/main/assets/logo.png" width="64" align="left" alt="Icenux">

        ## Icenux

        Tell us what would make the project better.

        <br clear="left">
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Type
      options:
        - New feature
        - Support for another compositor / DE
        - Support for another distribution
        - Packaging (APT / RPM)
        - Documentation
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request
