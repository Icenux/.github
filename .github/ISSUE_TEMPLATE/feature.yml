name: Feature request
description: Suggest an improvement or a new feature
title: "[FEATURE] "
labels: ["ToDo"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what would make the project better.
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Type
      options:
        - New feature
        - Improvement of existing behavior
        - Compatibility / platform support
        - Packaging / distribution
        - Documentation
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request
